<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="332" viewBox="0 0 960 332" role="img" aria-labelledby="title desc">
<title id="title">Architecture and current focus</title><desc id="desc">Simplified SkyCommand execution: React operator interface to Node.js Core API to Temporal workflows to tools and optional agents. PostgreSQL stores workflow and run metadata. Focus: orchestration, agent integration, observability and scoped delivery.</desc>

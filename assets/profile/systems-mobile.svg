<text x="26" y="86" font-size="17" fill="#A4BDCF" font-weight="400" text-anchor="start">Flexible access · callable services</text><text x="26" y="108" font-size="17" fill="#A4BDCF" font-weight="400" text-anchor="start">Centralized state</text>

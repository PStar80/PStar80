<g id="workflows"><rect x="320" y="364" width="140" height="68" fill="#071A29" stroke="#25B8D6" stroke-width="1.5"/><text x="390.0" y="392.65" font-size="19" fill="#F0F7FC" font-weight="600" text-anchor="middle">Published</text><text x="390.0" y="416.65" font-size="19" fill="#F0F7FC" font-weight="600" text-anchor="middle">Workflows</text></g>

<g id="capabilities"><rect x="16" y="350" width="448" height="124" fill="#061521" fill-opacity=".72" stroke="#39788E" stroke-width="1.5"/><text x="32" y="377" font-size="16" fill="#A4BDCF" font-weight="500" text-anchor="start">Execution capabilities</text>
<g id="tools"><rect x="28" y="396" width="136" height="60" fill="#071A29" stroke="#25B8D6" stroke-width="1.5"/><text x="96" y="420.475" font-size="18.5" fill="#F0F7FC" font-weight="600" text-anchor="middle">Registered</text><text x="96" y="444.475" font-size="18.5" fill="#F0F7FC" font-weight="600" text-anchor="middle">Tools</text></g>
<g id="agents"><rect x="172" y="396" width="136" height="60" fill="#071A29" stroke="#25B8D6" stroke-width="1.5"/><text x="240" y="420.475" font-size="18.5" fill="#F0F7FC" font-weight="600" text-anchor="middle">Embedded AI</text><text x="240" y="444.475" font-size="18.5" fill="#F0F7FC" font-weight="600" text-anchor="middle">Agents</text></g>
<g id="workflows"><rect x="316" y="396" width="136" height="60" fill="#071A29" stroke="#25B8D6" stroke-width="1.5"/><text x="384" y="420.475" font-size="18.5" fill="#F0F7FC" font-weight="600" text-anchor="middle">Published</text><text x="384" y="444.475" font-size="18.5" fill="#F0F7FC" font-weight="600" text-anchor="middle">Workflows</text></g></g>
<g id="endpoints"><rect x="16" y="518" width="448" height="120" fill="#061521" fill-opacity=".72" stroke="#39788E" stroke-width="1.5"/><text x="32" y="545" font-size="16" fill="#A4BDCF" font-weight="500" text-anchor="start">Automation endpoints</text>
<g id="file-system"><rect x="28" y="564" width="136" height="56" fill="#071A29" stroke="#25B8D6" stroke-width="1.5"/><text x="96" y="598.475" font-size="18.5" fill="#F0F7FC" font-weight="600" text-anchor="middle">File system</text></g>
<g id="database"><rect x="172" y="564" width="136" height="56" fill="#071A29" stroke="#25B8D6" stroke-width="1.5"/><text x="240" y="598.475" font-size="18.5" fill="#F0F7FC" font-weight="600" text-anchor="middle">Database</text></g>
<g id="git-repositories"><rect x="316" y="564" width="136" height="56" fill="#071A29" stroke="#25B8D6" stroke-width="1.5"/><text x="384" y="586.475" font-size="18.5" fill="#F0F7FC" font-weight="600" text-anchor="middle">Git</text><text x="384" y="610.475" font-size="18.5" fill="#F0F7FC" font-weight="600" text-anchor="middle">repositories</text></g></g>
</svg>

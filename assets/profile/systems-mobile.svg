<svg xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI,Arial,sans-serif" data-profile-refinement="2" data-profile-layout="3" data-architecture="grouped-endpoints-v1" width="480" height="660" viewBox="0 0 480 660" role="img" aria-labelledby="title desc">
<title id="title">SkyCommand system architecture</title>
<desc id="desc">Operators and external coding agents can each use the React UI or Node.js Core API, grouped into one shared access box. One arrow leads to a container holding Registered Tools, Embedded AI Agents and Published Workflows. One arrow connects that container to an automation-endpoints container holding File system on the left, Database in the middle and Git repositories on the right. This is a conceptual capability and endpoint view; configured permissions apply.</desc>
<defs>
<linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06111C"/><stop offset=".55" stop-color="#07131F"/><stop offset="1" stop-color="#020A12"/></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#D8E7EE"/><stop offset=".10" stop-color="#3C596D"/><stop offset=".26" stop-color="#9DB5C4"/><stop offset=".42" stop-color="#1F3547"/><stop offset=".57" stop-color="#6B96B1"/><stop offset=".72" stop-color="#E3F4FF"/><stop offset=".84" stop-color="#365569"/><stop offset="1" stop-color="#91ACBF"/></linearGradient>
<linearGradient id="accent"><stop stop-color="#25D6FF"/><stop offset="1" stop-color="#148CFF" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#40BCFF" stroke-opacity=".055"/></pattern>
<marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L7 4L1 7Z" fill="#25D6FF"/></marker>
</defs>
<style>
.sweep{opacity:.55;animation:sweep 26s linear infinite}
.spark{opacity:.70;animation:sweep 26s linear infinite}
.route-main{animation:flow 8s linear infinite}
@keyframes sweep{to{stroke-dashoffset:-100}}
@keyframes flow{to{stroke-dashoffset:-100}}
@media(prefers-reduced-motion:reduce){.sweep,.spark,.route-main{animation:none!important}}
</style>
<rect x="2" y="2" width="476" height="656" fill="url(#surface)" stroke="url(#metal)" stroke-width="2"/><rect x="7" y="7" width="466" height="646" fill="url(#grid)" stroke="#163349"/>
<path d="M2 2H478V658H2Z" fill="none" stroke="#25D6FF" stroke-width="1.5" opacity=".55" pathLength="100" stroke-dasharray="6 94" class="sweep"/>
<path d="M2 2H478V658H2Z" fill="none" stroke="#E6FAFF" stroke-width="1.5" opacity=".70" pathLength="100" stroke-dasharray="1.2 98.8" class="spark"/>
<path d="M21 9H9V21M459 9H471V21M21 651H9V639M459 651H471V639" fill="none" stroke="#A9C9DD" opacity=".65"/>
<text x="26" y="43" font-size="25" fill="#F0F7FC" font-weight="650" text-anchor="start">System Architecture</text><path d="M25 62H455" stroke="#22485C"/><rect x="25" y="61" width="70" height="2" fill="url(#accent)"/>
<text x="26" y="86" font-size="17" fill="#A4BDCF" font-weight="400" text-anchor="start">Flexible access · grouped capabilities</text>
<text x="26" y="108" font-size="17" fill="#A4BDCF" font-weight="400" text-anchor="start">Automation endpoints</text>
<path id="operator-access" d="M122 190V216H154V244" fill="none" stroke="#25B8D6" stroke-width="2" marker-end="url(#arrow)"/><path d="M122 190V216H154V244" fill="none" stroke="#D8FAFF" stroke-width="2" pathLength="100" stroke-dasharray="7 93" opacity=".65" class="route-main"/>
<path id="coding-access" d="M358 190V216H326V244" fill="none" stroke="#25B8D6" stroke-width="2" marker-end="url(#arrow)"/><path d="M358 190V216H326V244" fill="none" stroke="#D8FAFF" stroke-width="2" pathLength="100" stroke-dasharray="7 93" opacity=".65" class="route-main"/>
<path id="access-capabilities" d="M240 310V350" fill="none" stroke="#25B8D6" stroke-width="2" marker-end="url(#arrow)"/><path d="M240 310V350" fill="none" stroke="#D8FAFF" stroke-width="2" pathLength="100" stroke-dasharray="7 93" opacity=".65" class="route-main"/>
<path id="capabilities-endpoints" d="M240 474V518" fill="none" stroke="#25B8D6" stroke-width="2" marker-end="url(#arrow)"/><path d="M240 474V518" fill="none" stroke="#D8FAFF" stroke-width="2" pathLength="100" stroke-dasharray="7 93" opacity=".65" class="route-main"/>
<g id="operator"><rect x="24" y="126" width="196" height="64" fill="#071A29" stroke="#25B8D6" stroke-width="1.5"/><text x="122" y="165.7" font-size="22" fill="#F0F7FC" font-weight="600" text-anchor="middle">Operator</text></g>
<g id="coding-agents"><rect x="260" y="126" width="196" height="64" fill="#071A29" stroke="#25B8D6" stroke-width="1.5"/><text x="358" y="153" font-size="20" fill="#F0F7FC" font-weight="600" text-anchor="middle">External coding</text><text x="358" y="177" font-size="20" fill="#F0F7FC" font-weight="600" text-anchor="middle">agents</text></g>

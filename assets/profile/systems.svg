<svg xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI,Arial,sans-serif" data-profile-refinement="2" data-profile-layout="3" data-architecture="grouped-endpoints-v1" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">SkyCommand system architecture</title>
<desc id="desc">Operators and external coding agents can each use the React UI or Node.js Core API, grouped into one shared access box. One arrow leads to a container holding Registered Tools, Embedded AI Agents and Published Workflows. One arrow connects that container to an automation-endpoints container holding File system on the left, Database in the middle and Git repositories on the right. This is a conceptual capability and endpoint view; configured permissions apply.</desc>
<defs>
<linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06111C"/><stop offset=".55" stop-color="#07131F"/><stop offset="1" stop-color="#020A12"/></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#D8E7EE"/><stop offset=".10" stop-color="#3C596D"/><stop offset=".26" stop-color="#9DB5C4"/><stop offset=".42" stop-color="#1F3547"/><stop offset=".57" stop-color="#6B96B1"/><stop offset=".72" stop-color="#E3F4FF"/><stop offset=".84" stop-color="#365569"/><stop offset="1" stop-color="#91ACBF"/></linearGradient>
<linearGradient id="accent"><stop stop-color="#25D6FF"/><stop offset="1" stop-color="#148CFF" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#40BCFF" stroke-opacity=".055"/></pattern>
<marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L7 4L1 7Z" fill="#25D6FF"/></marker>
</defs>
<style>
.sweep{opacity:.55;animation:sweep 26s linear infinite}
.spark{opacity:.70;animation:sweep 26s linear infinite}
.route-main{animation:flow 8s linear infinite}
@keyframes sweep{to{stroke-dashoffset:-100}}
@keyframes flow{to{stroke-dashoffset:-100}}
@media(prefers-reduced-motion:reduce){.sweep,.spark,.route-main{animation:none!important}}
</style>
<rect x="2" y="2" width="956" height="596" fill="url(#surface)" stroke="url(#metal)" stroke-width="2"/><rect x="7" y="7" width="946" height="586" fill="url(#grid)" stroke="#163349"/>
<path d="M2 2H958V598H2Z" fill="none" stroke="#25D6FF" stroke-width="1.5" opacity=".55" pathLength="100" stroke-dasharray="6 94" class="sweep"/>
<path d="M2 2H958V598H2Z" fill="none" stroke="#E6FAFF" stroke-width="1.5" opacity=".70" pathLength="100" stroke-dasharray="1.2 98.8" class="spark"/>
<path d="M21 9H9V21M939 9H951V21M21 591H9V579M939 591H951V579" fill="none" stroke="#A9C9DD" opacity=".65"/>
<text x="26" y="43" font-size="25" fill="#F0F7FC" font-weight="650" text-anchor="start">System Architecture</text><path d="M25 62H935" stroke="#22485C"/><rect x="25" y="61" width="70" height="2" fill="url(#accent)"/>
<text x="26" y="89" font-size="17" fill="#A4BDCF" font-weight="400" text-anchor="start">Flexible access · grouped capabilities · automation endpoints</text>
<path id="operator-access" d="M247 170V195H365V222" fill="none" stroke="#25B8D6" stroke-width="2" marker-end="url(#arrow)"/><path d="M247 170V195H365V222" fill="none" stroke="#D8FAFF" stroke-width="2" pathLength="100" stroke-dasharray="7 93" opacity=".65" class="route-main"/>
<path id="coding-access" d="M713 170V195H595V222" fill="none" stroke="#25B8D6" stroke-width="2" marker-end="url(#arrow)"/><path d="M713 170V195H595V222" fill="none" stroke="#D8FAFF" stroke-width="2" pathLength="100" stroke-dasharray="7 93" opacity=".65" class="route-main"/>
<path id="access-capabilities" d="M480 280V326" fill="none" stroke="#25B8D6" stroke-width="2" marker-end="url(#arrow)"/><path d="M480 280V326" fill="none" stroke="#D8FAFF" stroke-width="2" pathLength="100" stroke-dasharray="7 93" opacity=".65" class="route-main"/>
<path id="capabilities-endpoints" d="M480 438V486" fill="none" stroke="#25B8D6" stroke-width="2" marker-end="url(#arrow)"/><path d="M480 438V486" fill="none" stroke="#D8FAFF" stroke-width="2" pathLength="100" stroke-dasharray="7 93" opacity=".65" class="route-main"/>
<g id="operator"><rect x="88" y="116" width="318" height="54" fill="#071A29" stroke="#25B8D6" stroke-width="1.5"/><text x="247" y="151.4" font-size="24" fill="#F0F7FC" font-weight="600" text-anchor="middle">Operator</text></g>
<g id="coding-agents"><rect x="554" y="116" width="318" height="54" fill="#071A29" stroke="#25B8D6" stroke-width="1.5"/><text x="713" y="151.4" font-size="24" fill="#F0F7FC" font-weight="600" text-anchor="middle">External coding agents</text></g>
<g id="shared-access"><rect x="200" y="222" width="560" height="58" fill="#071A29" stroke="#25B8D6" stroke-width="1.5"/><text x="480" y="259.75" font-size="25" fill="#F0F7FC" font-weight="600" text-anchor="middle">React UI / Node.js Core API</text></g>
<g id="capabilities"><rect x="26" y="326" width="908" height="112" fill="#061521" fill-opacity=".72" stroke="#39788E" stroke-width="1.5"/><text x="42" y="353" font-size="16" fill="#A4BDCF" font-weight="500" text-anchor="start">Execution capabilities</text>
<g id="tools"><rect x="42" y="368" width="276" height="50" fill="#071A29" stroke="#25B8D6" stroke-width="1.5"/><text x="180" y="401.05" font-size="23" fill="#F0F7FC" font-weight="600" text-anchor="middle">Registered Tools</text></g>
<g id="agents"><rect x="342" y="368" width="276" height="50" fill="#071A29" stroke="#25B8D6" stroke-width="1.5"/><text x="480" y="401.05" font-size="23" fill="#F0F7FC" font-weight="600" text-anchor="middle">Embedded AI Agents</text></g>
<g id="workflows"><rect x="642" y="368" width="276" height="50" fill="#071A29" stroke="#25B8D6" stroke-width="1.5"/><text x="780" y="401.05" font-size="23" fill="#F0F7FC" font-weight="600" text-anchor="middle">Published Workflows</text></g></g>
<g id="endpoints"><rect x="26" y="486" width="908" height="96" fill="#061521" fill-opacity=".72" stroke="#39788E" stroke-width="1.5"/><text x="42" y="513" font-size="16" fill="#A4BDCF" font-weight="500" text-anchor="start">Automation endpoints</text>
<g id="file-system"><rect x="42" y="526" width="276" height="40" fill="#071A29" stroke="#25B8D6" stroke-width="1.5"/><text x="180" y="554.05" font-size="23" fill="#F0F7FC" font-weight="600" text-anchor="middle">File system</text></g>
<g id="database"><rect x="342" y="526" width="276" height="40" fill="#071A29" stroke="#25B8D6" stroke-width="1.5"/><text x="480" y="554.05" font-size="23" fill="#F0F7FC" font-weight="600" text-anchor="middle">Database</text></g>
<g id="git-repositories"><rect x="642" y="526" width="276" height="40" fill="#071A29" stroke="#25B8D6" stroke-width="1.5"/><text x="780" y="554.05" font-size="23" fill="#F0F7FC" font-weight="600" text-anchor="middle">Git repositories</text></g></g>
</svg>

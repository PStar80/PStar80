<g id="endpoints"><rect x="26" y="530" width="908" height="96" fill="#061521" fill-opacity=".72" stroke="#39788E" stroke-width="1.5"/><text x="42" y="557" font-size="16" fill="#A4BDCF" font-weight="500" text-anchor="start">Automation Endpoints</text>

<path d="M2 2H958V648H2Z" fill="none" stroke="#25D6FF" stroke-width="1.5" opacity=".55" pathLength="100" stroke-dasharray="6 94" class="sweep"/>
<path d="M2 2H958V648H2Z" fill="none" stroke="#E6FAFF" stroke-width="1.5" opacity=".70" pathLength="100" stroke-dasharray="1.2 98.8" class="spark"/>

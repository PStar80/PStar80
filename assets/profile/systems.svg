main"/><path d="M480.0 252V268H710.0V282" fill="none" stroke="#26718A" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M480.0 252V268H710.0V282" fill="none" stroke="#25D6FF" stroke-width="1.6" pathLength="100" stroke-dasharray="8 92" opacity=".65" class="route-main"/><path d="M710.0 336V352H480.0V368" fill="none" stroke="#26718A" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M710.0 336V352H480.0V368" fill="none" stroke="#25D6FF" stroke-width="1.6" pathLength="100" stroke-dasharray="8 92" opacity=".65" class="route-agent"/><path d="M190 403H32V225H310" fill="none" stroke="#26718A" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M190 403H32V225H310" fill="none" stroke="#25D6FF" stroke-width="1.6" pathLength="100" stroke-dasharray="8 92" opacity=".65" class="route-agent"/><rect x="60" y="108" width="240" height="62" fill="#071A29" stroke="#26718A" stroke-width="1"/><text x="180" y="133" font-size="20" fill="#F0F7FC" font-weight="600" text-anchor="middle">Operator</text><text x="180" y="156" font-size="17" fill="#A4BDCF" font-weight="400" text-anchor="middle">React UI</text><rect x="470" y="108" width="430" height="62" fill="#071A29" stroke="#26718A" stroke-width="1"/><text x="685" y="133" font-size="20" fill="#F0F7FC" font-weight="600" text-anchor="middle">External coding agents</text><text x="685" y="156" font-size="17" fill="#A4BDCF" font-weight="400" text-anchor="middle">External MCP connection</text><rect x="310" y="198" width="340" height="54" fill="#071A29" stroke="#26718A" stroke-width="1"/><text x="480" y="223" font-size="20" fill="#F0F7FC" font-weight="600" text-anchor="middle">Node.js Core API</text><text x="480" y="246" font-size="16" fill="#A4BDCF" font-weight="400" text-anchor="middle">Registered platform services</text><rect x="80" y="282" width="340" height="54" fill="#071A29" stroke="#26718A" stroke-width="1"/><text x="250" y="307" font-size="18.5" fill="#F0F7FC" font-weight="600" text-anchor="middle">Registered Tools</text><text x="250" y="330" font-size="17" fill="#A4BDCF" font-weight="400" text-anchor="middle">Normal execution contracts</text><rect x="540" y="282" width="340" height="54" fill="#071A29" stroke="#26718A" stroke-width="1"/><text x="710" y="307" font-size="20" fill="#F0F7FC" font-weight="600" text-anchor="middle">Published Workflows</text><text x="710" y="330" font-size="17" fill="#A4BDCF" font-weight="400" text-anchor="middle">Temporal · deterministic</text><rect x="190" y="368" width="580" height="70" fill="#071A29" stroke="#26718A" stroke-width="1"/><text x="480" y="396" font-size="20" fill="#F0F7FC" font-weight="600" text-anchor="middle">Embedded Agent Run → run-bound MCP</text><text x="480" y="423" font-size="17" fill="#A4BDCF" font-weight="400" text-anchor="middle">Optional node · Project + Agent-version capabilities</text><path d="M26 451H934" stroke="#22485C"/><text x="26" y="477" font-size="18" fill="#25D6FF" font-weight="500" text-anchor="start">PostgreSQL · workflow / run state and results</text><text x="26" y="505" font-size="16" fill="#A4BDCF" font-weight="400" text-anchor="start">Conceptual flow · configured permissions apply</text>
</svg>

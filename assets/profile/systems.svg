<path id="cloud-operator" d="M246 140V170" fill="none" stroke="#25B8D6" stroke-width="2" marker-end="url(#arrow)"/><path d="M246 140V170" fill="none" stroke="#D8FAFF" stroke-width="2" pathLength="100" stroke-dasharray="7 93" opacity=".65" class="route-main"/>
<path id="cloud-dropbox" d="M396 115H490" fill="none" stroke="#25B8D6" stroke-width="2" marker-end="url(#arrow)"/><path d="M396 115H490" fill="none" stroke="#D8FAFF" stroke-width="2" pathLength="100" stroke-dasharray="7 93" opacity=".65" class="route-main"/>

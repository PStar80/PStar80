<svg xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI,Arial,sans-serif" data-profile-refinement="2" data-profile-layout="3" width="471" height="362" viewBox="0 0 471 362" role="img" aria-labelledby="desc">
<desc id="desc">SkyDataStudio public project card with a View button. The entire card image opens the matching GitHub repository.</desc>
<defs>
<linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06111C"/><stop offset=".55" stop-color="#07131F"/><stop offset="1" stop-color="#020A12"/></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#D8E7EE"/><stop offset=".10" stop-color="#3C596D"/><stop offset=".26" stop-color="#9DB5C4"/><stop offset=".42" stop-color="#1F3547"/><stop offset=".57" stop-color="#6B96B1"/><stop offset=".72" stop-color="#E3F4FF"/><stop offset=".84" stop-color="#365569"/><stop offset="1" stop-color="#91ACBF"/></linearGradient>
<linearGradient id="accent"><stop stop-color="#25D6FF"/><stop offset="1" stop-color="#148CFF" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#40BCFF" stroke-opacity=".055"/></pattern>
<marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#8CDCF0" stroke-width="1.2"/></marker>
</defs>
<style>
.sweep{opacity:.55;animation:sweep 26s linear infinite}
.spark{opacity:.70;animation:sweep 26s linear infinite}
.route-main{animation:flow 8s linear infinite}
.route-agent{opacity:.25;animation:agent 14s ease-in-out infinite}
@keyframes sweep{to{stroke-dashoffset:-100}}
@keyframes flow{to{stroke-dashoffset:-100}}
@keyframes agent{0%,45%,90%,100%{opacity:.22}60%,75%{opacity:.8}}
@media(prefers-reduced-motion:reduce){.sweep,.spark,.route-main,.route-agent{animation:none!important}.route-agent{opacity:.45}}
</style>
<rect x="2" y="2" width="467" height="358" fill="url(#surface)" stroke="url(#metal)" stroke-width="2"/><rect x="7" y="7" width="457" height="348" fill="url(#grid)" stroke="#163349" stroke-width="1"/><path d="M2 2H469V360H2Z" fill="none" stroke="#25D6FF" stroke-width="1.5" opacity="0.55" pathLength="100" stroke-dasharray="6 94" class="sweep" style="animation-delay:-8s"/><path d="M2 2H469V360H2Z" fill="none" stroke="#E6FAFF" stroke-width="1.5" opacity="0.7" pathLength="100" stroke-dasharray="1.2 98.8" class="spark" style="animation-delay:-8.1s"/><path d="M21 9H9V21" fill="none" stroke="#A9C9DD" opacity=".65"/><path d="M450 9H462V21" fill="none" stroke="#A9C9DD" opacity=".65"/><path d="M21 353H9V341" fill="none" stroke="#A9C9DD" opacity=".65"/><path d="M450 353H462V341" fill="none" stroke="#A9C9DD" opacity=".65"/><g transform="translate(25 22) scale(1.04167)" fill="none" stroke="#25D6FF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="4"/><path d="M3 5v14c0 5 18 5 18 0V5M3 12c0 5 18 5 18 0"/></g><text x="63" y="43" font-size="25" fill="#F0F7FC" font-weight="650" text-anchor="start">SkyDataStudio</text><path d="M25 62H446" stroke="#22485C"/><rect x="25" y="61" width="70" height="2" fill="url(#accent)" stroke="none" stroke-width="0"/><rect x="26" y="80" width="150" height="28" fill="#071C2A" stroke="#23617C" stroke-width="1"/><text x="101" y="99" font-size="13" fill="#25D6FF" font-weight="600" text-anchor="middle">PUBLIC PROJECT</text><text x="26" y="143" font-size="20" fill="#A4BDCF" font-weight="400" text-anchor="start">Data engineering workbench for</text><text x="26" y="170" font-size="20" fill="#A4BDCF" font-weight="400" text-anchor="start">governed analytical products.</text><text x="26" y="197" font-size="20" fill="#A4BDCF" font-weight="400" text-anchor="start">Pipelines, quality and lineage.</text><rect x="26" y="216" width="419" height="57" fill="#061C2A" stroke="#21465E" stroke-width="1"/><rect x="31" y="228" width="90" height="33" fill="#071A29" stroke="#26718A" stroke-width="1"/><text x="76" y="250" font-size="15" fill="#25D6FF" font-weight="500" text-anchor="middle">Prepare</text><path d="M121 244H190.5" stroke="#26718A"/><rect x="190.5" y="228" width="90" height="33" fill="#071A29" stroke="#26718A" stroke-width="1"/><text x="235.5" y="250" font-size="15" fill="#25D6FF" font-weight="500" text-anchor="middle">Transform</text><path d="M280.5 244H350" stroke="#26718A"/><rect x="350" y="228" width="90" height="33" fill="#071A29" stroke="#26718A" stroke-width="1"/><text x="395" y="250" font-size="15" fill="#25D6FF" font-weight="500" text-anchor="middle">Publish</text><text x="26" y="309" font-size="18" fill="#F0F7FC" font-weight="600" text-anchor="start">Python · FastAPI · PostgreSQL</text><text x="26" y="337" font-size="17" fill="#A4BDCF" font-weight="400" text-anchor="start">Airflow · dbt · Docker</text><g id="view-skydatastudio-cta" aria-hidden="true"><rect x="376" y="15" width="81" height="32" rx="4" fill="url(#surface)" stroke="url(#metal)" stroke-width="1.5"/><rect x="376" y="15" width="81" height="32" rx="4" fill="none" stroke="#12C7FF" stroke-width="1.25" opacity=".8" pathLength="100" stroke-dasharray="8 92" class="sweep" style="animation-delay:-6s"/><rect x="376" y="15" width="81" height="32" rx="4" fill="none" stroke="#E6FAFF" stroke-width="1" opacity=".95" pathLength="100" stroke-dasharray="1.2 98.8" class="spark" style="animation-delay:-6.1s"/><rect x="379" y="18" width="75" height="26" rx="3" fill="#0A2030" stroke="#26536C" stroke-width="1"/><path d="M385 18h22" stroke="#25D6FF" stroke-width="1.2" opacity=".85"/><text x="408" y="37" fill="#F0F7FC" font-size="15" font-weight="600" text-anchor="middle">View</text><path d="M432 25h10v10m0-10-11 11" fill="none" stroke="#25D6FF" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></g></svg>

<svg data-profile-refinement="2" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="150" height="66" viewBox="0 0 150 66" role="img" aria-labelledby="title desc">
<title id="title">Email</title><desc id="desc">Email — follow the enclosing README link.</desc>
<defs>
  <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#06111C"/><stop offset=".55" stop-color="#07131F"/><stop offset="1" stop-color="#020A12"/>
  </linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#D8E7EE"/><stop offset=".10" stop-color="#3C596D"/><stop offset=".26" stop-color="#9DB5C4"/>
    <stop offset=".42" stop-color="#1F3547"/><stop offset=".57" stop-color="#6B96B1"/><stop offset=".72" stop-color="#E3F4FF"/><stop offset=".84" stop-color="#365569"/><stop offset="1" stop-color="#91ACBF"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#25D6FF"/><stop offset="1" stop-color="#148CFF" stop-opacity="0"/></linearGradient>
  <linearGradient id="fade"><stop stop-color="black"/><stop offset=".18" stop-color="white"/><stop offset=".94" stop-color="white"/><stop offset="1" stop-color="black"/></linearGradient>
  <mask id="artFade" maskContentUnits="objectBoundingBox"><rect width="1" height="1" fill="url(#fade)"/></mask>
  <radialGradient id="aura"><stop stop-color="#038AC2" stop-opacity=".30"/><stop offset="1" stop-color="#021322" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#40BCFF" stroke-opacity=".055" stroke-width="1"/></pattern>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="2"/></filter>
</defs>
<style>
  .sweep { opacity:.55; animation: sweep 26s linear infinite; }
  .spark { opacity:.70; animation: sweep 26s linear infinite; }
  .pulse { animation: pulse 6s ease-in-out infinite; }
  .flow { animation: flow 9s linear infinite; }
  .rise { animation: rise 7s ease-in-out infinite; }
  @keyframes sweep { to { stroke-dashoffset: -100; } }
  @keyframes pulse { 0%,100% { opacity:.35; } 50% { opacity:.9; } }
  @keyframes flow { to { stroke-dashoffset:-54; } }
  @keyframes rise { 0%,100% { opacity:.35; } 50% { opacity:1; } }
  @media (prefers-reduced-motion: reduce) {
    .sweep,.spark,.pulse,.flow,.rise { animation:none !important; }
  }
</style><style>
.hub-stream{animation:hub-data 6s linear infinite}
.hub-halo{opacity:.16;animation:hub-breathe 7s ease-in-out infinite}
.hub-ring{animation:hub-data 18s linear infinite}
.hub-dust{animation:hub-drift 11s ease-in-out infinite}
.route-main{animation:hub-data 7s linear infinite}
.route-agent{opacity:.12;animation:agent-window 14s ease-in-out infinite}
@keyframes hub-data{to{stroke-dashoffset:-100}}
@keyframes hub-breathe{0%,100%{opacity:.10}50%{opacity:.28}}
@keyframes hub-drift{0%,100%{transform:translateY(0);opacity:.12}50%{transform:translateY(-6px);opacity:.5}}
@keyframes agent-window{0%,48%,90%,100%{opacity:.12}62%,76%{opacity:.85}}
@media(prefers-reduced-motion:reduce){.hub-stream,.hub-halo,.hub-ring,.hub-dust,.route-main,.route-agent{animation:none!important}.hub-dust{display:none}.hub-stream,.route-main{opacity:.35}.route-agent{opacity:.45}}
</style>
<rect x="2" y="2" width="146" height="62" fill="url(#surface)" stroke="url(#metal)" stroke-width="2" /><rect x="7" y="7" width="136" height="52" fill="none" stroke="#163349" stroke-width="1" /><rect x="8" y="8" width="134" height="50" fill="url(#grid)" stroke="none" stroke-width="0" /><path d="M2 2H148V64H2Z" pathLength="100" fill="none" stroke="#12C7FF" stroke-width="2.2" opacity=".8" stroke-dasharray="8 92" class="sweep" style="animation-delay:-6s"/><path d="M2 2H148V64H2Z" pathLength="100" fill="none" stroke="#E6FAFF" stroke-width="1.8" opacity=".95" stroke-dasharray="1.2 98.8" class="spark" style="animation-delay:-6.1s"/><path d="M21 9H9V21" fill="none" stroke="#A9C9DD" stroke-opacity=".65" stroke-width="1"/><path d="M129 9H141V21" fill="none" stroke="#A9C9DD" stroke-opacity=".65" stroke-width="1"/><path d="M21 57H9V45" fill="none" stroke="#A9C9DD" stroke-opacity=".65" stroke-width="1"/><path d="M129 57H141V45" fill="none" stroke="#A9C9DD" stroke-opacity=".65" stroke-width="1"/><g transform="translate(12 23) scale(0.8333333333333334)" fill="none" stroke="#25D6FF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16"/><path d="M1 5l11 8L23 5"/></g><text x="75" y="42" fill="#F0F7FC" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Email</text>
</svg>
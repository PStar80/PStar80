ont-size="19" fill="#B5CBDC" font-weight="400" text-anchor="start">From interfaces and APIs to databases and</text><text x="26" y="349" font-size="19" fill="#B5CBDC" font-weight="400" text-anchor="start">containerized services, I build end to end.</text><text x="26" y="389" font-size="19" fill="#B5CBDC" font-weight="400" text-anchor="start">My focus now is AI-native applications:</text><text x="26" y="416" font-size="19" fill="#B5CBDC" font-weight="400" text-anchor="start">agentic AI, MCP-connected coding agents</text><text x="26" y="443" font-size="19" fill="#B5CBDC" font-weight="400" text-anchor="start">and automation across the software lifecycle.</text><path d="M26 470H446" stroke="#22485C" /><text x="26" y="497" font-size="16" fill="#87A9C2" font-weight="400" text-anchor="start">Toronto, Canada · Full-stack engineering</text><rect x="490" y="2" width="468" height="516" fill="url(#surface)" stroke="url(#metal)" stroke-width="2" /><rect x="495" y="7" width="458" height="506" fill="url(#grid)" stroke="#163349" /><path d="M490 2H958V518H490Z" pathLength="100" fill="none" stroke="#25D6FF" stroke-width="1.6" opacity=".45" stroke-dasharray="6 94" class="sweep" /><path d="M490 2H958V518H490Z" pathLength="100" fill="none" stroke="#E6FAFF" stroke-width="1.2" opacity=".6" stroke-dasharray=".9 99.1" class="spark" /><path d="M509 9H497V21" fill="none" stroke="#A9C9DD" opacity=".65" /><path d="M939 9H951V21" fill="none" stroke="#A9C9DD" opacity=".65" /><path d="M509 511H497V499" fill="none" stroke="#A9C9DD" opacity=".65" /><path d="M939 511H951V499" fill="none" stroke="#A9C9DD" opacity=".65" /><g transform="translate(514 23)" fill="none" stroke="#25D6FF" stroke-width="1.6"><path d="M2 7l10-5 10 5-10 5zM2 12l10 5 10-5M2 17l10 5 10-5" /></g><text x="551" y="43" font-size="25" fill="#F0F7FC" font-weight="650" text-anchor="start">Tech Stack</text><path d="M514 62H934" stroke="#22485C" /><text x="514" y="95" font-size="18" fill="#B5CBDC" font-weight="400" text-anchor="start">End-
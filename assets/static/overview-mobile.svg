<title id="title">About me and technology stack</title><desc id="desc">Enterprise backend, data and workflow engineering. Python, JavaScript, C#/.NET, React, Node.js, PostgreSQL, Docker, Temporal, Oracle PL/SQL, REST APIs, Git/GitHub, TypeScript. Static reduced-motion version.</desc>

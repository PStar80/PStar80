<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1056" viewBox="0 0 480 1056" role="img" aria-labelledby="title desc" font-family="Segoe UI,Arial,sans-serif" data-profile-refinement="2" data-intro="full-stack-v1" data-motion="static">
<title id="title">Full-stack engineering — about me and technology stack</title><desc id="desc">About me: I build scalable full-stack applications across workflow automation, data engineering and interactive data visualization. SkyCommand orchestrates work; SkyDataStudio creates trusted data products; MacroAnalyzer makes data explorable. My focus is AI-native applications integrating agentic AI, MCP-connected coding agents and workflow automation. Technology stack: Python, JavaScript, C#/.NET, React, Node.js, PostgreSQL, Docker, Temporal, Oracle/SQL, REST APIs, Git/GitHub and TypeScript. Static reduced-motion version.</desc>

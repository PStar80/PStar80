<rect x="2" y="2" width="476" height="516" fill="url(#surface)" stroke="url(#metal)" stroke-width="2" /><rect x="7" y="7" width="466" height="506" fill="url(#grid)" stroke="#163349" /><path d="M2 2H478V518H2Z" pathLength="100" fill="none" stroke="#25D6FF" stroke-width="1.6" opacity=".45" stroke-dasharray="6 94" class="sweep" /><path d="M2 2H478V518H2Z" pathLength="100" fill="none" stroke="#E6FAFF" stroke-width="1.2" opacity=".6" stroke-dasharray=".9 99.1" class="spark" /><path d="M21 9H9V21" fill="none" stroke="#A9C9DD" opacity=".65" /><path d="M459 9H471V21" fill="none" stroke="#A9C9DD" opacity=".65" /><path d="M21 511H9V499" fill="none" stroke="#A9C9DD" opacity=".65" /><path d="M459 511H471V499" fill="none" stroke="#A9C9DD" opacity=".65" /><g transform="translate(26 23)" fill="none" stroke="#25D6FF" stroke-width="1.6"><circle cx="12" cy="7" r="4" /><path d="M3 23v-3c0-7 18-7 18 0v3" /></g><text x="63" y="43" font-size="25" fill="#F0F7FC" font-weight="650" text-anchor="start">About Me</text><path d="M26 62H454" stroke="#22485C" /><text x="26" y="98" font-size="21" fill="#F0F7FC" font-weight="600" text-anchor="start">Full-stack systems. Built to connect.</text><text x="26" y="134" font-size="19" fill="#B5CBDC" font-weight="400" text-anchor="start">I build scalable full-stack applications</text><text x="26" y="161" font-size="19" fill="#B5CBDC" font-weight="400" text-anchor="start">for workflow automation, data engineering</text><text x="26" y="188" font-size="19" fill="#B5CBDC" font-weight="400" text-anchor="start">and interactive data visualization.</text><text x="26" y="228" font-size="19" fill="#B5CBDC" font-weight="400" text-anchor="start">SkyCommand orchestrates work.</text><text x="26" y="255" font-size="19" fill="#B5CBDC" font-weight="400" text-anchor="start">SkyDataStudio creates trusted data products.</text><text x="26" y="282" font-size="19" fill="#B5CBDC" font-weight="400" text-anchor="start">MacroAnalyzer brings data to life.</text><text x="26" y="322" font-size="19" fill="#B5CBDC" font-weight="400" text-anchor="start">From interfaces and APIs to databases and</text><text x="26" y="349" font-size="19" fill="#B5CBDC" font-weight="400" text-anchor="start">containerized services, I build end to end.</text><text x="26" y="389" font-size="19" fill="#B5CBDC" font-weight="400" text-anchor="start">My focus now is AI-native applications:</text><text x="26" y="416" font-size="19" fill="#B5CBDC" font-weight="400" text-anchor="start">agentic AI, MCP-connected coding agents</text><text x="26" y="443" font-size="19" fill="#B5CBDC" font-weight="400" text-anchor="start">and automation across the software lifecycle.</text><path d="M26 470H454" stroke="#22485C" /><text x="26" y="497" font-size="16" fill="#87A9C2" font-weight="400" text-anchor="start">Toronto, Canada · Full-stack engineering</text><rect x="2" y="538" width="476" height="516" fill="url(#surface)" stroke="url(#metal)" stroke-width="2" /><rect x="7" y="543" width="466" height="506" fill="url(#grid)" stroke="#163349" /><path d="M2 538H478V1054H2Z" pathLength="100" fill="none" stroke="#25D6FF" stroke-width="1.6" opacity=".45" stroke-dasharray="6 94" class="sweep" /><path d="M2 538H478V1054H2Z" pathLength="100" fill="none" stroke="#E6FAFF" stroke-width="1.2" opacity=".6" stroke-dasharray=".9 99.1" class="spark" /><path d="M21 545H9V557" fill="none" stroke="#A9C9DD" opacity=".65" /><path d="M459 545H471V557" fill="none" stroke="#A9C9DD" opacity=".65" /><path d="M21 1047H9V1035" fill="none" stroke="#A9C9DD" opacity=".65" /><path d="M459 1047H471V1035" fill="none" stroke="#A9C9DD" opacity=".65" /><g transform="translate(26 559)" fill="none" stroke="#25D6FF" stroke-width="1.6"><path d="M2 7l10-5 10 5-10 5zM2 12l10 5 10-5M2 17l10 5 10-5" /></g><text x="63" y="579" font-size="25" fill="#F0F7FC" font-weight="650" text-anchor="start">Tech Stack</text><path d="M26 598H454" stroke="#22485C" /><text x="26" y="631" font-size="18" fill="#B5CBDC" font-weight="400" text-anchor="start">En
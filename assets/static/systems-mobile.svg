<svg xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI,Arial,sans-serif" data-profile-refinement="2" data-architecture="mcp-work-orders" width="480" height="1032" viewBox="0 0 480 1032" role="img" aria-labelledby="title desc" data-motion="static">
<title id="title">SkyCommand MCP, agent capabilities and work-order architecture</title>
<desc id="desc">React UI and external coding agents through MCP use shared SkyCommand services. Workflows can invoke embedded agents with run-bound MCP and configured Project and Agent-version capabilities. Work-order coordination is the current development method; native integration is planned for Phase 20. Illustrative flow, not live telemetry. Static reduced-motion version.</desc>

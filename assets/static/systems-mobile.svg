<svg xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI,Arial,sans-serif" data-profile-refinement="2" data-profile-layout="3" data-architecture="cloud-local-relay-v2" width="480" height="764" viewBox="0 0 480 764" role="img" aria-labelledby="desc" data-motion="static">

<desc id="desc">Cloud Agent connects to the Operator and to Cloud File Storage. Cloud File Storage relays work artifacts to the Local Agent; the Operator initiates the Local Agent. Operator and Local Agent both use React UI / Node.js Core API. One arrow leads to Execution Capabilities containing Registered Tools, Embedded AI Agents and Published Workflows. One arrow leads to Automation Endpoints containing File System and Database in the left column, with Git Repositories and Web APIs in the right column. The cloud/local relay illustrates the current development setup. Configured permissions apply. Static reduced-motion version.</desc>

<title id="title">Architecture and current focus</title><desc id="desc">Simplified SkyCommand execution: React operator interface to Node.js Core API to Temporal workflows to tools and optional agents. PostgreSQL stores workflow and run metadata. Focus: orchestration, agent integration, observability and scoped delivery. Static reduced-motion version.</desc>
